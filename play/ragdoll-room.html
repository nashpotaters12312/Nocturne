<title>Ragdoll Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE occasion, a 3D sandbox toy
   IDEA one small concrete test room with lifelike ragdolls that have insides
   PICTURE the room itself fills the screen; UI shrinks to a row of icons
   COLOUR warm concrete, blood red, x-ray cyan, one yellow accent for the active tool
   TYPE Inter only, small
   LAYOUT full-bleed 3D view, tool pill at the bottom, three icon buttons top-right, tiny vitals chip top-left */
:root{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#1a1a1a}
body{font:13px/1.3 Inter,system-ui,sans-serif;color:#f2f2f2;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%!important;height:100%!important;display:block}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.ib{width:42px;height:42px;border-radius:50%;background:#0008;display:grid;place-items:center;backdrop-filter:blur(6px)}
.ib svg{width:22px;height:22px}
.ib.on{background:#5ee7ff;color:#002833}
.tr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.tools{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:4px;padding:5px;border-radius:30px;background:#0009;backdrop-filter:blur(8px)}
.tools button{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#ddd}
.tools button svg{width:24px;height:24px}
.tools button.on{background:#ffd23f;color:#111}
#chip{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(10px,env(safe-area-inset-left,0px));background:#000a;border-radius:14px;padding:8px 10px;backdrop-filter:blur(6px);max-width:min(240px,calc(100vw - 180px))}
#chip .h{display:flex;gap:8px;align-items:center;font-weight:800}
#chip .h b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chip .h button{background:none;color:#aaa;font-size:16px;padding:0 2px}
#chip .v{display:flex;gap:10px;margin-top:4px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
#chip .s{font-size:11px;font-weight:800;margin-top:3px}
#chip .more{margin-top:6px;max-height:42vh;overflow-y:auto;touch-action:pan-y}
#chip .r{display:flex;justify-content:space-between;gap:10px;padding:1.5px 0;font-size:12px}
#chip .r em{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums}
#chip .tg{margin-top:6px;background:#ffffff1a;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:800}
.g{color:#7ee8a2}.y{color:#ffd23f}.rd{color:#ff6b6b}
#tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);background:#000a;border-radius:10px;padding:5px 10px;font-weight:600;white-space:nowrap;transition:opacity .4s;pointer-events:none;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#err{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:#1a1a1a;font-size:16px}
</style>

<div class="tr">
  <button class="ib" data-act="spawn" aria-label="Add person" title="Add person"><svg viewBox="0 0 24 24"><circle cx="10" cy="7" r="3.5" fill="currentColor"/><path d="M3 21c0-5 3-8 7-8s7 3 7 8z" fill="currentColor"/><path d="M19 5v6M16 8h6" stroke="currentColor" stroke-width="2"/></svg></button>
  <button class="ib" data-act="xray" id="xrayB" aria-label="X-ray" title="X-ray"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v9M7 11h10M8 14h8M9 21l3-4 3 4" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
  <button class="ib" data-act="reset" aria-label="Reset room" title="Reset room"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg></button>
</div>
<div id="chip" hidden></div>
<div id="tip"></div>
<div class="tools" id="tools"></div>
<div id="err" hidden>3D graphics aren't available on this device or browser.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],clamp=(v,a,b)=>v<a?a:v>b?b:v;
const RX=2.6,RZ=2.6,RH=2.8; // room half sizes / height

/* ---------- tools ---------- */
const TOOLS=[
['grab','<path d="M8 13V5a2 2 0 0 1 4 0v6M12 11V4a2 2 0 0 1 4 0v7M16 11V6a2 2 0 0 1 4 0v8c0 5-3 8-7 8s-6-2-8-5l-2-4a2 2 0 0 1 3-2l2 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>','Drag people. Drag empty space to look around.'],
['knife','<path d="M3 21 14 10l3 3L6 21z" fill="currentColor"/><path d="M14 10l6-7 1 1-4 9z" fill="currentColor" opacity=".6"/>','Swipe across someone to cut. Two fingers or right-drag to look around.'],
['gun','<path d="M2 8h17l2-2v6h-6l-1 2h-3l-1 7H6l1-7H2z" fill="currentColor"/>','Tap to shoot.'],
['bomb','<circle cx="11" cy="14" r="7" fill="currentColor"/><path d="M15 8l3-4" stroke="currentColor" stroke-width="2"/>','Tap to drop a bomb.'],
['heal','<rect x="9" y="2" width="6" height="12" rx="1" fill="currentColor"/><path d="M12 14v8M7 4h10" stroke="currentColor" stroke-width="2"/>','Tap someone to heal or revive them.'],
];
let tool='grab',tipT=0;
$('tools').innerHTML=TOOLS.map(t=>`<button data-tool="${t[0]}" aria-label="${t[0]}" class="${t[0]===tool?'on':''}"><svg viewBox="0 0 24 24">${t[1]}</svg></button>`).join('');
function setTool(t){tool=t;for(const b of document.querySelectorAll('[data-tool]'))b.classList.toggle('on',b.dataset.tool===t);tip(TOOLS.find(x=>x[0]===t)[2])}
function tip(s){$('tip').textContent=s;$('tip').style.opacity=1;tipT=3}

if(!window.THREE||!window.CANNON){$('err').hidden=false;throw new Error('libs')}
let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true})}catch(e){$('err').hidden=false;throw e}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#1a1a1a');
const camera=new THREE.PerspectiveCamera(62,1,.05,50);
const cam={th:.6,ph:1.25,r:2.4,tx:0,ty:1,tz:0};

/* ---------- room ---------- */
function tex(draw,s=512,rep=1){const c=document.createElement('canvas');c.width=c.height=s;draw(c.getContext('2d'),s);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t}
const floorT=tex((g,s)=>{g.fillStyle='#8b8d8f';g.fillRect(0,0,s,s);for(let i=0;i<4;i++)for(let j=0;j<4;j++){g.fillStyle=`hsl(210,3%,${50+Math.random()*6}%)`;g.fillRect(i*s/4+2,j*s/4+2,s/4-4,s/4-4)}for(let k=0;k<900;k++){g.fillStyle=`rgba(0,0,0,${Math.random()*.06})`;g.fillRect(Math.random()*s,Math.random()*s,2,2)}},512,3);
const wallT=tex((g,s)=>{g.fillStyle='#c9c3b8';g.fillRect(0,0,s,s);for(let k=0;k<2500;k++){g.fillStyle=`rgba(${Math.random()<.5?0:255},${Math.random()<.5?0:255},0,${Math.random()*.035})`;g.fillRect(Math.random()*s,Math.random()*s,3,3)}g.fillStyle='#0000000f';for(let y=0;y<s;y+=128)g.fillRect(0,y,s,2)},512,2);
const room=new THREE.Group();scene.add(room);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(RX*2,RZ*2),new THREE.MeshStandardMaterial({map:floorT,roughness:.85}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;room.add(floor);
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(RX*2,RZ*2),new THREE.MeshStandardMaterial({color:'#d8d4cc',roughness:1}));ceil.rotation.x=Math.PI/2;ceil.position.y=RH;room.add(ceil);
const wallM=new THREE.MeshStandardMaterial({map:wallT,roughness:.95});
for(const [x,z,ry] of [[0,-RZ,0],[0,RZ,Math.PI],[-RX,0,Math.PI/2],[RX,0,-Math.PI/2]]){const w=new THREE.Mesh(new THREE.PlaneGeometry(RX*2,RH),wallM);w.position.set(x,RH/2,z);w.rotation.y=ry;w.receiveShadow=true;room.add(w);
  const bb=new THREE.Mesh(new THREE.BoxGeometry(RX*2,.12,.03),new THREE.MeshStandardMaterial({color:'#4a4a4a'}));bb.position.set(x,.06,z);bb.rotation.y=ry;bb.translateZ(.015);room.add(bb)}
const door=new THREE.Mesh(new THREE.BoxGeometry(.95,2.05,.04),new THREE.MeshStandardMaterial({color:'#5b6470',roughness:.6}));door.position.set(1.1,1.025,-RZ+.02);room.add(door);
const knob=new THREE.Mesh(new THREE.SphereGeometry(.035,12,8),new THREE.MeshStandardMaterial({color:'#ccc',metalness:.8,roughness:.3}));knob.position.set(.75,1,-RZ+.07);room.add(knob);
const signC=document.createElement('canvas');signC.width=1024;signC.height=300;{const g=signC.getContext('2d');g.fillStyle='#ffd23f';g.fillRect(0,0,1024,300);g.fillStyle='#111';g.font='bold 150px Inter,Arial,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('TEST ROOM',512,155)}const signT=new THREE.CanvasTexture(signC);signT.encoding=THREE.sRGBEncoding;const sign=new THREE.Mesh(new THREE.PlaneGeometry(1.02,.3),new THREE.MeshBasicMaterial({map:signT}));sign.position.set(-1,1.9,-RZ+.01);room.add(sign);
const lamp=new THREE.Mesh(new THREE.CylinderGeometry(.25,.3,.06,24),new THREE.MeshBasicMaterial({color:'#fff6dc'}));lamp.position.set(0,RH-.03,0);room.add(lamp);
scene.add(new THREE.HemisphereLight('#fff4e0','#4a4440',.55));
const light=new THREE.PointLight('#fff1d6',1.3,12,1.6);light.position.set(0,RH-.2,0);light.castShadow=true;light.shadow.mapSize.set(1024,1024);light.shadow.bias=-.002;scene.add(light);
const flashL=new THREE.PointLight('#ffb050',0,8,2);scene.add(flashL);

/* ---------- physics world ---------- */
const world=new CANNON.World();world.gravity.set(0,-9.82,0);world.broadphase=new CANNON.NaiveBroadphase();world.solver.iterations=18;
world.defaultContactMaterial.friction=.6;world.defaultContactMaterial.restitution=.05;
const STATIC=1;
function plane(pos,axis,ang){const b=new CANNON.Body({mass:0});b.addShape(new CANNON.Plane());b.position.set(...pos);if(axis)b.quaternion.setFromAxisAngle(new CANNON.Vec3(...axis),ang);b.collisionFilterGroup=STATIC;b.collisionFilterMask=0xffff;world.addBody(b)}
plane([0,0,0],[1,0,0],-Math.PI/2);plane([0,RH,0],[1,0,0],Math.PI/2);plane([0,0,-RZ],null,0);plane([0,0,RZ],[0,1,0],Math.PI);plane([-RX,0,0],[0,1,0],Math.PI/2);plane([RX,0,0],[0,1,0],-Math.PI/2);

/* ---------- people ---------- */
const SKIN=['#f1c7a3','#e0ac85','#c68b62','#9c6a45','#6e4a32','#f5d6bd'],SHIRT=['#3a7bd5','#d94848','#2fa36b','#e0a526','#7a5bd6','#e9ecef','#2b2f36','#e86fa3'],PANTS=['#2b3a55','#3c3c3c','#5b4636','#1f4e5f','#4a4f57'];
const NAMES=['Steve','Carl','Dana','Morgan','Rex','Jo','Pat','Sam','Lou','Kit','Ash','Robin'];
const PARTS=[
// name, kind, size, pos, mass, colorKey, parent, pivot(world), angle, twist, bone, artery
['lower','box',[.16,.11,.1],[0,.98,0],12,'pants',null],
['upper','box',[.19,.18,.11],[0,1.29,0],14,'shirt','lower',[0,1.09,0],.35,.3,'Ribs','aorta'],
['head','sphere',[.11],[0,1.62,0],5,'skin','upper',[0,1.49,0],.6,.6,'Skull','carotid'],
['uArmL','box',[.05,.14,.05],[-.25,1.31,0],2.2,'shirt','upper',[-.25,1.45,0],1.5,.8,'Left humerus','brachL'],
['fArmL','box',[.045,.14,.045],[-.25,1.03,0],1.6,'skin','uArmL',[-.25,1.17,0],1.1,.2,'Left forearm',null],
['uArmR','box',[.05,.14,.05],[.25,1.31,0],2.2,'shirt','upper',[.25,1.45,0],1.5,.8,'Right humerus','brachR'],
['fArmR','box',[.045,.14,.045],[.25,1.03,0],1.6,'skin','uArmR',[.25,1.17,0],1.1,.2,'Right forearm',null],
['thighL','box',[.075,.21,.075],[-.09,.66,0],8,'pants','lower',[-.09,.87,0],.8,.3,'Left femur','femL'],
['shinL','box',[.06,.21,.06],[-.09,.23,0],4,'pants','thighL',[-.09,.44,0],.9,.1,'Left shin',null],
['thighR','box',[.075,.21,.075],[.09,.66,0],8,'pants','lower',[.09,.87,0],.8,.3,'Right femur','femR'],
['shinR','box',[.06,.21,.06],[.09,.23,0],4,'pants','thighR',[.09,.44,0],.9,.1,'Right shin',null],
];
let people=[],gid=0,sel=null,xray=false;
const allMeshes=[];
const woundGeo=new THREE.SphereGeometry(.016,8,6),woundMat=new THREE.MeshStandardMaterial({color:'#4a0008',roughness:.3});
const capMat=new THREE.MeshStandardMaterial({color:'#8e0f1a',roughness:.4}),boneMat=new THREE.MeshStandardMaterial({color:'#f1eadb',roughness:.5});
const xBone=new THREE.MeshBasicMaterial({color:'#e8f6ff'}),xArt=new THREE.MeshBasicMaterial({color:'#ff2d40'});
function limbMesh(r,h,mat){const g=new THREE.Group();const c=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,14),mat);g.add(c);for(const y of[-h/2,h/2]){const s=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),mat);s.position.y=y;g.add(s)}g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});return g}
function torsoMesh(hx,hy,hz,mat){const g=new THREE.Group();const c=new THREE.Mesh(new THREE.CylinderGeometry(1,1,hy*2,20),mat);c.scale.set(hx,1,hz);g.add(c);for(const y of[-hy,hy]){const s=new THREE.Mesh(new THREE.SphereGeometry(1,20,10),mat);s.scale.set(hx,.04,hz);s.position.y=y;g.add(s)}g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});return g}
function spawn(x,z){
  if(people.length>=6)removePerson(people[0]);
  const id=gid++,grp=1<<(1+id%13),mask=0xffff&~grp;
  const col={skin:pick(SKIN),shirt:pick(SHIRT),pants:pick(PANTS)},hair=pick(['#2b1d14','#5a3a1e','#c9a15a','#111','#7a2e14','#888']);
  const yaw=rand(0,Math.PI*2),q=new CANNON.Quaternion();q.setFromAxisAngle(new CANNON.Vec3(0,1,0),yaw);
  const rot=v=>{const r=q.vmult(new CANNON.Vec3(v[0],v[1],v[2]));return new CANNON.Vec3(r.x+x,r.y,r.z+z)};
  const p={id,name:pick(NAMES),parts:{},joints:{},mats:{},blood:100,oxy:100,org:{brain:100,heart:100,lungL:100,lungR:100,spineU:100,spineD:100,guts:100},art:{carotid:1,aorta:1,brachL:1,brachR:1,femL:1,femR:1},
    born:performance.now(),lost:{},wounds:[],alive:true,heartOn:true,conscious:true,bpm:72,beat:0,pulse:0,pain:0,getup:3,cause:'',decap:false,group:grp};
  for(const d of PARTS){
    const [name,kind,sz,pos,mass,ck,parent,piv,ang,tw,bone,art]=d;
    const body=new CANNON.Body({mass,position:rot(pos),quaternion:q.clone?q.clone():new CANNON.Quaternion(q.x,q.y,q.z,q.w)});
    body.addShape(kind==='box'?new CANNON.Box(new CANNON.Vec3(...sz)):new CANNON.Sphere(sz[0]));
    body.linearDamping=.05;body.angularDamping=.35;body.collisionFilterGroup=grp;body.collisionFilterMask=mask;world.addBody(body);
    const mat=new THREE.MeshStandardMaterial({color:col[ck],roughness:.75,transparent:false});
    let mesh;
    if(name==='head'){mesh=new THREE.Group();const h=new THREE.Mesh(new THREE.SphereGeometry(sz[0],24,18),mat);h.castShadow=true;mesh.add(h);
      const hm=new THREE.Mesh(new THREE.SphereGeometry(sz[0]*1.04,24,12,0,Math.PI*2,0,Math.PI*.45),new THREE.MeshStandardMaterial({color:hair,roughness:.9}));hm.rotation.x=-.25;hm.castShadow=true;mesh.add(hm);p.hairMat=hm.material;
      const eyeM=new THREE.MeshBasicMaterial({color:'#111'});for(const s of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(.013,8,6),eyeM);e.position.set(s*.04,.01,sz[0]*.95);mesh.add(e);(p.eyes=p.eyes||[]).push(e)}
      const nose=new THREE.Mesh(new THREE.SphereGeometry(.018,8,6),mat);nose.position.set(0,-.02,sz[0]);mesh.add(nose);
      const mouth=new THREE.Mesh(new THREE.BoxGeometry(.045,.008,.01),eyeM);mouth.position.set(0,-.055,sz[0]*.93);mesh.add(mouth);p.mouth=mouth}
    else if(kind==='box'&&(name==='upper'||name==='lower'))mesh=torsoMesh(sz[0],sz[1],sz[2],mat);
    else{mesh=limbMesh(sz[0],sz[1]*2-sz[0]*2,mat);
      if(name.startsWith('fArm')){const hnd=new THREE.Mesh(new THREE.SphereGeometry(.045,12,8),new THREE.MeshStandardMaterial({color:col.skin,roughness:.75}));hnd.position.y=-sz[1]-.01;hnd.castShadow=true;mesh.add(hnd);p.mats[name+'h']=hnd.material}
      if(name.startsWith('shin')){const sh=new THREE.Mesh(new THREE.BoxGeometry(.1,.06,.2),new THREE.MeshStandardMaterial({color:'#222',roughness:.6}));sh.position.set(0,-sz[1]+.01,.05);sh.castShadow=true;mesh.add(sh)}}
    mesh.userData={p,part:name};scene.add(mesh);allMeshes.push(mesh);p.mats[name]=mat;
    // x-ray internals
    const xr=new THREE.Group();xr.visible=xray;mesh.add(xr);
    const part={name,body,mesh,xr,size:sz,kind,bone:100,boneName:bone,art,hp:100,parent,piv,caps:[],loose:false,slashT:0};
    buildXray(p,part);
    p.parts[name]=part;
    body.addEventListener('collide',e=>{if(performance.now()-p.born<2000)return;try{const v=Math.abs(e.contact.getImpactVelocityAlongNormal());if(v>6.5)impact(p,part,v)}catch(_){}});
  }
  for(const d of PARTS){const [name,,,pos,,,parent,piv,ang,tw]=d;if(!parent)continue;
    const A=p.parts[parent].body,B=p.parts[name].body,pa=PARTS.find(x=>x[0]===parent)[3];
    const c=new CANNON.ConeTwistConstraint(A,B,{pivotA:new CANNON.Vec3(piv[0]-pa[0],piv[1]-pa[1],piv[2]-pa[2]),pivotB:new CANNON.Vec3(piv[0]-pos[0],piv[1]-pos[1],piv[2]-pos[2]),axisA:new CANNON.Vec3(0,1,0),axisB:new CANNON.Vec3(0,1,0),angle:ang,twistAngle:tw});
    c.collideConnected=false;world.addConstraint(c);p.joints[name]={c,pivA:[piv[0]-pa[0],piv[1]-pa[1],piv[2]-pa[2]],pivB:[piv[0]-pos[0],piv[1]-pos[1],piv[2]-pos[2]]}}
  people.push(p);return p;
}
function buildXray(p,part){const g=part.xr,s=part.size,n=part.name;
  const add=(geo,mat,pos,sc)=>{const m=new THREE.Mesh(geo,mat);if(pos)m.position.set(...pos);if(sc)m.scale.set(...sc);g.add(m);return m};
  part.x={};
  if(n==='head'){part.x.skull=add(new THREE.SphereGeometry(.1,14,10),new THREE.MeshBasicMaterial({color:'#e8f6ff',wireframe:true}));part.x.brain=add(new THREE.SphereGeometry(.08,16,12),new THREE.MeshBasicMaterial({color:'#ff9db4'}),[0,.02,-.005]);
    part.x.art=add(new THREE.CylinderGeometry(.008,.008,.12,6),xArt.clone(),[.04,-.1,.02])}
  else if(n==='upper'){for(let i=0;i<5;i++)add(new THREE.TorusGeometry(1,.06,6,20),xBone,[0,.1-i*.055,0],[.17,.1,1]).rotation.x=Math.PI/2;
    part.x.spine=add(new THREE.BoxGeometry(.03,.36,.03),new THREE.MeshBasicMaterial({color:'#bfe9ff'}),[0,0,-.08]);
    part.x.lungL=add(new THREE.SphereGeometry(1,14,10),new THREE.MeshBasicMaterial({color:'#ff8fa8'}),[-.08,.02,0],[.065,.12,.07]);
    part.x.lungR=add(new THREE.SphereGeometry(1,14,10),new THREE.MeshBasicMaterial({color:'#ff8fa8'}),[.08,.02,0],[.065,.12,.07]);
    part.x.heart=add(new THREE.SphereGeometry(.045,14,10),new THREE.MeshBasicMaterial({color:'#ff1f33'}),[.025,-.03,.04]);
    part.x.art=add(new THREE.CylinderGeometry(.012,.012,.34,6),xArt.clone(),[-.02,0,-.04])}
  else if(n==='lower'){part.x.spine=add(new THREE.BoxGeometry(.03,.2,.03),new THREE.MeshBasicMaterial({color:'#bfe9ff'}),[0,0,-.07]);add(new THREE.TorusGeometry(.12,.025,6,18),xBone,[0,-.06,0]).rotation.x=Math.PI/2;

/* ---------- pointers ---------- */
const ptrs=new Map();let mode=null,downInfo=null,pinch0=0;
const cv=renderer.domElement;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{initAudio();try{cv.setPointerCapture(e.pointerId)}catch(_){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){endGrab();mode='orbit2';const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);return}
  downInfo={x:e.clientX,y:e.clientY,moved:0,btn:e.button};
  if(e.button===2){mode='orbit';return}
  if(tool==='grab'){const h=partHit(e.clientX,e.clientY);if(h){sel=h.p;startGrab(h);mode='grab'}else mode='orbit'}
  else if(tool==='knife'){mode='knife';lastSlice=[e.clientX,e.clientY];slice(e.clientX,e.clientY)}
  else mode='tap';
});
cv.addEventListener('pointermove',e=>{const pr=ptrs.get(e.pointerId);if(!pr)return;const dx=e.clientX-pr.x,dy=e.clientY-pr.y;pr.x=e.clientX;pr.y=e.clientY;
  if(mode==='orbit2'&&ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);cam.r=clamp(cam.r*pinch0/d,1.2,3);pinch0=d;cam.th-=dx*.004;cam.ph=clamp(cam.ph-dy*.003,.5,1.6);return}
  if(downInfo)downInfo.moved+=Math.abs(dx)+Math.abs(dy);
  if(mode==='grab')moveGrab(e.clientX,e.clientY);
  else if(mode==='orbit'||(mode==='tap'&&downInfo&&downInfo.moved>10)){mode='orbit';cam.th-=dx*.006;cam.ph=clamp(cam.ph-dy*.005,.5,1.6)}
  else if(mode==='knife'){const steps=Math.ceil(Math.hypot(dx,dy)/8);for(let i=1;i<=steps;i++)slice(e.clientX-dx+dx*i/steps,e.clientY-dy+dy*i/steps);lastSlice=[e.clientX,e.clientY];knifeTrail(e.clientX,e.clientY)}
});
const upH=e=>{ptrs.delete(e.pointerId);
  if(mode==='tap'&&downInfo&&downInfo.moved<=10){const x=e.clientX,y=e.clientY;
    if(tool==='gun')shoot(x,y);else if(tool==='bomb')dropBomb(x,y);else if(tool==='heal'){const h=partHit(x,y);if(h){sel=h.p;heal(h.p)}}}
  if(mode==='orbit'&&tool==='grab'&&downInfo&&downInfo.moved<=6&&!partHit(e.clientX,e.clientY))sel=null;
  if(ptrs.size===0){endGrab();mode=null;downInfo=null}else if(ptrs.size===1&&mode==='orbit2')mode='orbit'};
cv.addEventListener('pointerup',upH);cv.addEventListener('pointercancel',upH);
cv.addEventListener('wheel',e=>{e.preventDefault();cam.r=clamp(cam.r*(1+e.deltaY*.001),1.2,3)},{passive:false});
const trail=[];function knifeTrail(x,y){trail.push({x,y,t:.15})}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tool]');if(t){setTool(t.dataset.tool);return}const a=e.target.closest('[data-act]');if(!a)return;
  if(a.dataset.act==='spawn'){sel=spawn(rand(-1.4,1.4),rand(-1.4,1.4))}
  else if(a.dataset.act==='xray'){xray=!xray;$('xrayB').classList.toggle('on',xray);for(const p of people)for(const k in p.parts){const pt=p.parts[k];pt.xr.visible=xray;pt.mesh.traverse(o=>{if(o.isMesh&&o.parent!==pt.xr&&!pt.xr.children.includes(o)&&o.material!==woundMat&&o.material!==capMat&&o.material!==boneMat){o.material.transparent=xray;o.material.opacity=xray?.22:1;o.material.depthWrite=!xray;o.castShadow=!xray}})}}
  else if(a.dataset.act==='reset'){for(const p of [...people])removePerson(p);for(const b of bombs){world.removeBody?world.removeBody(b.b):world.remove(b.b);scene.remove(b.m)}bombs=[];drops=[];dMesh.count=0;hMesh.count=0;dIdx=hIdx=0;setup()}
  else if(a.dataset.act==='close'){sel=null}
  else if(a.dataset.act==='more'){showMore=!showMore;chipT=0}
});

/* ---------- audio ---------- */
let actx=null;const lastS={};
function initAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function snd(f,d,t,v,sl,n){if(!actx)return;const now=actx.currentTime;if(lastS[n]&&now-lastS[n]<.05)return;lastS[n]=now;try{const o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.setValueAtTime(f,now);if(sl)o.frequency.exponentialRampToValueAtTime(sl,now+d);g.gain.setValueAtTime(v,now);g.gain.exponentialRampToValueAtTime(.0001,now+d);o.connect(g);g.connect(actx.destination);o.start(now);o.stop(now+d)}catch(e){}}
let flashT=0;function flash(t){flashT=t}

/* ---------- vitals chip ---------- */
let showMore=false,chipT=0;
function chip(){const el=$('chip');if(!sel||!people.includes(sel)){el.hidden=true;return}el.hidden=false;const p=sel;
  const st=!p.alive?['Dead · '+p.cause,'rd']:!p.conscious?['Unconscious','y']:p.wounds.some(w=>w.art&&!w.loose)?['Bleeding out','y']:p.pain>50?['In pain','y']:['Okay','g'];
  const c=v=>v>60?'g':v>25?'y':'rd';
  let more='';if(showMore){const o=p.org;const parts=Object.values(p.parts).filter(x=>!x.loose&&x.boneName);
    more=`<div class="more">${[['Brain',o.brain],['Heart',o.heart],['Left lung',o.lungL],['Right lung',o.lungR],['Upper spine',o.spineU],['Lower spine',o.spineD],['Guts',o.guts]].map(([n,v])=>`<div class="r"><span>${n}</span><em class="${c(v)}">${Math.round(v)}</em></div>`).join('')}
    ${parts.map(x=>`<div class="r"><span>${x.boneName}</span><em class="${x.bone>0?'g':'rd'}">${x.bone>0?'OK':'Broken'}</em></div>`).join('')}
    ${[['Carotid','carotid'],['Aorta','aorta'],['L arm artery','brachL'],['R arm artery','brachR'],['L leg artery','femL'],['R leg artery','femR']].map(([n,k])=>`<div class="r"><span>${n}</span><em class="${p.art[k]?'g':'rd'}">${p.art[k]?'OK':'Cut'}</em></div>`).join('')}
    <div class="r"><span>Limbs</span><em>${4-Object.keys(p.lost).length}/4</em></div></div>`}
  el.innerHTML=`<div class="h"><b>${p.name}</b><button data-act="close" aria-label="Close">×</button></div><div class="s ${st[1]}">${st[0]}</div>
  <div class="v"><span class="${p.heartOn?'g':'rd'}">♥ ${p.heartOn?p.bpm:'—'}</span><span class="${c(p.blood)}">Blood ${Math.round(p.blood)}%</span><span class="${c(p.oxy)}">O₂ ${Math.round(p.oxy)}%</span></div>${more}
  <button class="tg" data-act="more">${showMore?'Less':'Organs & bones'}</button>`}

/* ---------- loop ---------- */
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<innerHeight?78:62;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
function setup(){const n=3;for(let i=0;i<n;i++){const a=i/n*Math.PI*2+.4;spawn(Math.cos(a)*1.1,Math.sin(a)*1.1)}sel=null}
let last=performance.now(),trailCv=document.createElement('canvas');
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  try{
    world.step(1/60,dt,4);
    for(const p of people){bodySim(p,dt);for(const k in p.parts){const pt=p.parts[k];if(pt.slashT>0)pt.slashT-=dt;pt.mesh.position.copy(pt.body.position);pt.mesh.quaternion.copy(pt.body.quaternion)}if(p.getup<3&&p.conscious)p.getup+=dt}
    stepBlood(dt);
    for(const b of bombs){b.t-=dt;b.m.position.copy(b.b.position);b.m.quaternion.copy(b.b.quaternion);b.fuse.material.color.set(Math.sin(now/1000*(30-b.t*10))>0?'#ff3b3b':'#ffb03b');if(b.t<=0){b.dead=1;world.removeBody?world.removeBody(b.b):world.remove(b.b);scene.remove(b.m);explode(b.m.position.clone())}}
    bombs=bombs.filter(b=>!b.dead);
    if(boomT>0){boomT-=dt;const p=1-boomT/.4;boomM.scale.setScalar(.2+p*1.4);boomM.material.opacity=Math.max(0,.9*(1-p))}else boomM.material.opacity=0;
    flashL.intensity=Math.max(0,flashL.intensity-dt*25);if(flashT>0){flashT-=dt;light.intensity=1.6}else light.intensity=1.3;
    const r=cam.r,sx=shake>0?rand(-shake,shake):0;shake=Math.max(0,shake-dt*.3);
    let px=cam.tx+r*Math.sin(cam.ph)*Math.sin(cam.th),py=cam.ty+r*Math.cos(cam.ph),pz=cam.tz+r*Math.sin(cam.ph)*Math.cos(cam.th);
    px=clamp(px,-RX+.15,RX-.15);pz=clamp(pz,-RZ+.15,RZ-.15);py=clamp(py,.2,RH-.15);
    camera.position.set(px+sx,py+sx,pz);camera.lookAt(cam.tx,cam.ty,cam.tz);
    renderer.render(scene,camera);
    chipT-=dt;if(chipT<=0){chipT=.25;chip()}
    if(tipT>0){tipT-=dt;if(tipT<=0)$('tip').style.opacity=0}
  }catch(err){console.error(err)}
  requestAnimationFrame(frame)}
window.__rr={get people(){return people},shoot,sever,explode,heal,world,camera,partHit,dropBomb};
resize();setup();setTool('grab');requestAnimationFrame(frame);
}
</script>
