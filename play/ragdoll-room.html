<title>Ragdoll Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE occasion, a 3D sandbox toy
   IDEA a big concrete test hall with lifelike ragdolls that have insides
   PICTURE the hall fills the screen; UI shrinks to one item pill and a drawer
   COLOUR warm concrete, blood red, x-ray cyan, one yellow accent for the active item
   TYPE Inter only, small
   LAYOUT full-bleed 3D view, item pill bottom-centre, drawer slides up, three icon buttons top-right, vitals chip top-left */
:root{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#1a1a1a}
body{font:13px/1.3 Inter,system-ui,sans-serif;color:#f2f2f2;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%!important;height:100%!important;display:block}
button{font:inherit;color:inherit;border:0;cursor:pointer}
svg{display:block}
.ib{width:42px;height:42px;border-radius:50%;background:#0008;display:grid;place-items:center;backdrop-filter:blur(6px)}
.ib svg{width:22px;height:22px}
.ib.on{background:#5ee7ff;color:#002833}
.tr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:4px;padding:5px;border-radius:30px;background:#0009;backdrop-filter:blur(8px);align-items:center}
.pill button{height:46px;border-radius:23px;display:flex;align-items:center;gap:8px;padding:0 12px;color:#ddd;font-weight:800;white-space:nowrap}
.pill button svg{width:24px;height:24px;flex:none}
.pill .cur{background:#ffd23f;color:#111;padding:0 16px 0 12px}
.pill .q{width:46px;padding:0;justify-content:center}
.pill .q.on{background:#ffffff26}
#drawer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 72px);width:min(560px,calc(100vw - 20px));max-height:min(60vh,480px);overflow-y:auto;touch-action:pan-y;background:#111c;backdrop-filter:blur(12px);border-radius:20px;padding:12px}
.cat{font-size:11px;font-weight:800;color:#9aa3ad;margin:6px 4px 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.it{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:14px;background:#ffffff10;font-weight:800;font-size:11.5px;text-align:center}
.it svg{width:28px;height:28px}
.it.on{background:#ffd23f;color:#111}
#chip{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(10px,env(safe-area-inset-left,0px));background:#000a;border-radius:14px;padding:8px 10px;backdrop-filter:blur(6px);max-width:min(240px,calc(100vw - 180px))}
#chip .h{display:flex;gap:8px;align-items:center;font-weight:800}
#chip .h b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chip .h button{background:none;color:#aaa;font-size:16px;padding:0 2px}
#chip .v{display:flex;gap:10px;margin-top:4px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;flex-wrap:wrap}
#chip .s{font-size:11px;font-weight:800;margin-top:3px}
#chip .more{margin-top:6px;max-height:42vh;overflow-y:auto;touch-action:pan-y}
#chip .r{display:flex;justify-content:space-between;gap:10px;padding:1.5px 0;font-size:12px}
#chip .r em{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums}
#chip .tg{margin-top:6px;background:#ffffff1a;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:800}
.g{color:#7ee8a2}.y{color:#ffd23f}.rd{color:#ff6b6b}
#tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);background:#000a;border-radius:10px;padding:5px 10px;font-weight:600;white-space:nowrap;transition:opacity .4s;pointer-events:none;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#err{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:#1a1a1a;font-size:16px}
#cross{position:fixed;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid #fff;border-radius:50%;pointer-events:none;box-shadow:0 0 0 1px #0008}
</style>

<div class="tr">
  <button class="ib" data-act="spawn" aria-label="Add person" title="Add person"><svg viewBox="0 0 24 24"><circle cx="10" cy="7" r="3.5" fill="currentColor"/><path d="M3 21c0-5 3-8 7-8s7 3 7 8z" fill="currentColor"/><path d="M19 5v6M16 8h6" stroke="currentColor" stroke-width="2"/></svg></button>

let item='grab',tipT=0;
const icon=it=>`<svg viewBox="0 0 24 24">${it.ic}</svg>`;

function renderDrawer(){const cats=[...new Set(ITEMS.map(i=>i.cat))];$('drawer').innerHTML=cats.map(c=>`<div class="cat">${c}</div><div class="grid">${ITEMS.filter(i=>i.cat===c).map(i=>`<button class="it ${i.id===item?'on':''}" data-item="${i.id}">${icon(i)}${i.name}</button>`).join('')}</div>`).join('')}
function setItem(id){item=id;renderPill();$('drawer').hidden=true;tip(ITEMS.find(i=>i.id===id).tip)}

const itemMode=()=>ITEMS.find(i=>i.id===item).m;

/* ---------- room ---------- */
function tex(draw,s,rx,ry){const c=document.createElement('canvas');c.width=c.height=s;draw(c.getContext('2d'),s);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry||rx);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t}

const wallT=tex((g,s)=>{g.fillStyle='#c6c0b4';g.fillRect(0,0,s,s);for(let k=0;k<2500;k++){g.fillStyle=`rgba(0,0,0,${Math.random()*.04})`;g.fillRect(Math.random()*s,Math.random()*s,3,3)}g.fillStyle='#00000014';for(let y=0;y<s;y+=128)g.fillRect(0,y,s,2);for(let x=0;x<s;x+=256)g.fillRect(x,0,2,s)},512,6,2);

for(const [x,z,ry] of [[0,-RZ,0],[0,RZ,Math.PI],[-RX,0,Math.PI/2],[RX,0,-Math.PI/2]]){const w=new THREE.Mesh(new THREE.PlaneGeometry(RX*2,RH),wallM);w.position.set(x,RH/2,z);w.rotation.y=ry;w.receiveShadow=true;room.add(w);
  const bb=new THREE.Mesh(new THREE.BoxGeometry(RX*2,.14,.03),new THREE.MeshStandardMaterial({color:'#3f3f3f'}));bb.position.set(x,.07,z);bb.rotation.y=ry;bb.translateZ(.015);room.add(bb);

const signT=new THREE.CanvasTexture(signC);signT.encoding=THREE.sRGBEncoding;const sign=new THREE.Mesh(new THREE.PlaneGeometry(2,.6),new THREE.MeshBasicMaterial({map:signT}));sign.position.set(-2,2.6,-RZ+.02);room.add(sign);

/* ---------- physics ---------- */
const world=new CANNON.World();world.gravity.set(0,-9.82,0);world.broadphase=new CANNON.NaiveBroadphase();world.solver.iterations=18;

function limbMesh(r,h,mat){const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,14),mat));for(const y of[-h/2,h/2]){const s=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),mat);s.position.y=y;g.add(s)}g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});return g}

function addWound(p,part,local,rate,art,big){const m=new THREE.Mesh(woundGeo,woundMat);m.position.set(local.x,local.y,local.z);m.scale.setScalar(big?2:art?1.5:1);part.mesh.add(m);

function bodySim(p,dt){
  if(p.adren>0)p.adren-=dt;
  if(p.poison>0&&p.alive){p.org.heart=Math.max(0,p.org.heart-dt*6);p.oxy-=dt*2;p.pain=Math.min(100,p.pain+dt*8);if(Math.random()<dt*4)p.twitch=Math.max(p.twitch,.3)}
  if(p.fire>0){p.fire-=dt;p.burn+=dt;p.pain=100;knock(p,0);p.org.lungL=Math.max(0,p.org.lungL-dt*3);p.org.lungR=Math.max(0,p.org.lungR-dt*3);
    const ks=Object.keys(p.parts);for(let i=0;i<4;i++){const pt=p.parts[pick(ks)];pt.char=Math.min(1,pt.char+dt*.5);const w=pt.body.position;flame(w.x+rand(-.06,.06),w.y+rand(-.06,.06),w.z+rand(-.06,.06),rand(-.2,.2),rand(.4,1.2),rand(-.2,.2),0,true)}

  if(p.alive){if(p.org.heart<=0&&p.heartOn){p.heartOn=false;p.cause=p.poison?'Poisoned':'Heart destroyed'}if(p.blood<15&&p.heartOn){p.heartOn=false;p.cause='Bled out'}

  else p.oxy=Math.max(0,p.oxy-11*dt);
  p.conscious=p.alive&&p.heartOn&&p.oxy>30&&p.blood>38&&p.org.brain>30;
  p.bpm=p.heartOn?Math.round(clamp(70+(100-p.blood)*1.5+p.pain*.3+p.fear*15+(p.adren>0?50:0)+(p.org.heart<60?20:0),40,210)):0;

    while(w.acc>1){w.acc-=1;const q=w.part.body.pointToWorldFrame(w.local);spray(q.x,q.y,q.z,rand(-.15,.15),rand(-.3,.1),rand(-.15,.15))}}
  p.blood=Math.max(0,p.blood-rate*dt*(p.heartOn?.45:.06));

  for(let i=0;i<(big?36:20);i++)spray(point.x,point.y,point.z,sw.x*rand(.5,3)+rand(-.3,.3),sw.y*rand(.5,3)+rand(0,1),sw.z*rand(.5,3)+rand(-.3,.3));
  snd(big?700:900,.07,'triangle',.04,300,'cut');noise(point);
  if(part.hp<=0&&part.name!=='lower'&&(part.name!=='upper'||big)){sever(p,part.name);part.hp=60}}
function flamethrow(x,y){setRay(x,y);const o=camera.position,dir=ray.ray.direction,right=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0);
  const sx=o.x+right.x*.18+dir.x*.3,sy=o.y-.22,sz=o.z+right.z*.18+dir.z*.3;for(let i=0;i<7;i++){const s=rand(5,8);flame(sx,sy,sz,dir.x*s+rand(-.6,.6),dir.y*s+rand(-.4,.6),dir.z*s+rand(-.6,.6),rand(.5,1))}
  if(Math.random()<.3)snd(90+Math.random()*40,.12,'sawtooth',.02,60,'flm')}
function igniteCheck(){for(const f of flames){if(f.own||f.t<f.max*.3)continue;for(const p of people)for(const k in p.parts){const b=p.parts[k].body.position;if(Math.abs(b.x-f.x)<.22&&Math.abs(b.y-f.y)<.25&&Math.abs(b.z-f.z)<.22){if(p.fire<=0&&p.alive)noise(new THREE.Vector3(b.x,b.y,b.z));p.fire=Math.max(p.fire,7);p.parts[k].char=Math.min(1,p.parts[k].char+.01);sel=sel||p}}
  for(const pr of props)if(pr.kind==='barrel'&&!pr.dead){const b=pr.body.position;if(Math.abs(b.x-f.x)<.35&&Math.abs(b.y-f.y)<.5&&Math.abs(b.z-f.z)<.35){pr.heat=(pr.heat||0)+1;if(pr.heat>40)explodeProp(pr)}}}}
const boomM=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),new THREE.MeshBasicMaterial({color:'#ffcf6b',transparent:true,opacity:0}));scene.add(boomM);let boomT=0,shake=0,flashT=0;
function explodeProp(pr){if(pr.dead)return;pr.dead=true;const pos=new THREE.Vector3(pr.body.position.x,pr.body.position.y,pr.body.position.z);removeProp(pr);explode(pos,pr.kind==='barrel'?2.8:2.2)}
function explode(pos,R){boomM.position.copy(pos);boomT=.45;flashL.position.copy(pos);flashL.intensity=8;shake=.1;snd(55,.8,'sawtooth',.15,25,'boom');noise(pos);
  decal(hMesh,hIdx++,400,pos.x,0,pos.z,0,1,0,R*.25);for(let i=0;i<40;i++)flame(pos.x,pos.y,pos.z,rand(-4,4),rand(0,5),rand(-4,4),rand(1,2.2),true);
  for(const p of people){let hit=false;
    for(const k in p.parts){const pt=p.parts[k],bp=pt.body.position,d=Math.hypot(bp.x-pos.x,bp.y-pos.y,bp.z-pos.z);if(d>R)continue;hit=true;const f=1-d/R,dir=V((bp.x-pos.x)/(d||1),(bp.y-pos.y)/(d||1)+.45,(bp.z-pos.z)/(d||1));
      pt.body.applyImpulse(V(dir.x*f*pt.body.mass*14,dir.y*f*pt.body.mass*14,dir.z*f*pt.body.mass*14),bp);pt.hp-=f*170;pt.bone=Math.max(0,pt.bone-f*140);pt.char=Math.min(1,pt.char+f*.8);
      if(Math.random()<f)organHit(p,pt,V(rand(-.05,.05),rand(-.05,.05),rand(-.05,.05)),f);if(Math.random()<f*.5)addWound(p,pt,V(rand(-.05,.05),rand(-.05,.05),rand(-.05,.05)),2,false);
      if(pt.hp<=0&&k!=='lower'&&Math.random()<.85&&(k!=='upper'||f>.75))sever(p,k);if(pt.impale&&f>.3)unimpale(pt)}
    if(hit){knock(p,100);p.blood-=6;if(Math.random()<.5)p.fire=Math.max(p.fire,3)}}
  for(const pr of [...props]){if(!pr.body||pr.dead)continue;const bp=pr.body.position,d=Math.hypot(bp.x-pos.x,bp.y-pos.y,bp.z-pos.z);if(d>R)continue;
    if(pr.kind==='barrel'){setTimeout(()=>explodeProp(pr),120);continue}if(pr.kind==='bomb'){pr.t=Math.min(pr.t,.1);continue}
    if(pr.body.mass>0){const f=1-d/R;pr.body.applyImpulse(V((bp.x-pos.x)/d*f*pr.body.mass*10,f*pr.body.mass*12,(bp.z-pos.z)/d*f*pr.body.mass*10),bp)}}}
function syringe(p,k){
  if(k==='heal'){for(const o in p.org)p.org[o]=100;for(const n in p.parts){const pt=p.parts[n];pt.bone=100;pt.hp=100;pt.stain=0;pt.char=0;pt.bruise=0;if(pt.impale)unimpale(pt);if(pt.crushed){pt.crushed=0;pt.mesh.scale.set(1,1,1)}}
    p.blood=100;p.oxy=100;p.pain=0;p.fire=0;p.burn=0;p.poison=0;
    for(const w of p.wounds)if(w.mesh&&!w.stump)w.part.mesh.remove(w.mesh);p.wounds=p.wounds.filter(w=>w.stump);for(const w of p.wounds){w.rate=.05;w.art=false}
    for(const a in p.art){const s=a.slice(-1);if(!(a.startsWith('brach')&&p.lost['arm'+s])&&!(a.startsWith('fem')&&p.lost['leg'+s]))p.art[a]=1}
    if(!p.decap&&!p.parts.upper.loose){p.alive=true;p.heartOn=true;p.cause='';p.state='down';p.downT=2}snd(600,.3,'sine',.06,1200,'heal')}
  else if(k==='adren'){p.adren=20;if(p.alive&&p.org.heart>0&&p.blood>15){p.heartOn=true;p.oxy=Math.max(p.oxy,40)}p.pain=0;snd(300,.3,'square',.04,900,'adr')}
  else{p.poison=1;snd(200,.4,'sine',.04,90,'poi')}}
function impaleCheck(){for(const tr of props){if(tr.kind!=='spikes')continue;for(const p of people)for(const k in p.parts){const pt=p.parts[k];if(pt.impale)continue;const b=pt.body;
  if(Math.abs(b.position.x-tr.x)<.58&&Math.abs(b.position.z-tr.z)<.58&&b.position.y<.42&&b.velocity.y<-2){
    const anchor=new CANNON.Body({mass:0,position:V(b.position.x,Math.max(.12,b.position.y),b.position.z)});anchor.collisionFilterGroup=0;anchor.collisionFilterMask=0;world.addBody(anchor);
    const c=new CANNON.PointToPointConstraint(b,V(0,0,0),anchor,V(0,0,0),600);world.addConstraint(c);pt.impale={c,anchor,trap:tr};
    addWound(p,pt,V(0,-.05,.06),2.5,Math.random()<.4,true);organHit(p,pt,V(rand(-.05,.05),0,rand(-.05,.05)),.9);knock(p,90);const w=b.position;for(let i=0;i<30;i++)spray(w.x,w.y,w.z,rand(-1.5,1.5),rand(.5,2.5),rand(-1.5,1.5));snd(250,.15,'square',.05,90,'imp')}}}}
function unimpale(pt){if(!pt.impale)return;world.removeConstraint(pt.impale.c);remBody(pt.impale.anchor);pt.impale=null}
function sawCheck(dt){for(const s of props){if(s.kind!=='saw')continue;s.blade.rotation.z-=dt*30;const c=s.mesh.position,cy=Math.cos(s.yaw),sy=Math.sin(s.yaw);
  for(const p of people)for(const k in p.parts){const pt=p.parts[k],b=pt.body.position,dx=b.x-c.x,dy=b.y-c.y,dz=b.z-c.z;const lx=dx*cy-dz*sy,lz=dx*sy+dz*cy,rr=pt.kind==='sphere'?pt.size[0]:pt.size[0]+.02;
    if(Math.abs(lz)<rr+.03&&Math.hypot(lx,dy)<s.r+rr*.5){pt.hp-=320*dt;knock(p,dt*200);if(Math.random()<.7){const n=Math.hypot(lx,dy)||1;for(let i=0;i<3;i++)spray(b.x,b.y,b.z,(-dy/n)*cy*rand(1,4)+rand(-.5,.5),(lx/n)*rand(1,4)+rand(0,1),(-dy/n)*-sy*rand(1,4)+rand(-.5,.5))}
      pt.body.applyImpulse(V(rand(-1,1)*.6,.6,rand(-1,1)*.6),b);pt.stain=Math.min(.7,pt.stain+dt);if(Math.random()<dt*4)organHit(p,pt,V(0,0,0),.3);if(Math.random()<.2)snd(1400,.05,'sawtooth',.02,900,'saw');
      if(pt.hp<=0&&k!=='lower'&&!(p.joints[k]&&p.joints[k].cut)){sever(p,k);pt.hp=60}}}}}

/* ---------- grab ---------- */
const mouseBody=new CANNON.Body({mass:0});mouseBody.collisionFilterGroup=0;mouseBody.collisionFilterMask=0;world.addBody(mouseBody);
let grab=null;const dragPlane=new THREE.Plane(),tmpV=new THREE.Vector3();
function startGrab(info){const b=info.p?info.part.body:info.prop.body;if(!b||b.mass===0)return false;const lp=b.pointToLocalFrame(V(info.point.x,info.point.y,info.point.z));mouseBody.position.set(info.point.x,info.point.y,info.point.z);
  const c=new CANNON.PointToPointConstraint(b,lp,mouseBody,V(0,0,0),info.p?500:2000);world.addConstraint(c);grab={c,p:info.p,part:info.part,body:b};
  dragPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(tmpV).clone().negate(),info.point);if(info.p){info.p.fear=Math.max(info.p.fear,.5);knock(info.p,10)}return true}
function moveGrab(x,y){if(!grab)return;setRay(x,y);const pt=new THREE.Vector3();if(ray.ray.intersectPlane(dragPlane,pt))mouseBody.position.set(clamp(pt.x,-RX+.1,RX-.1),clamp(pt.y,.05,RH-.1),clamp(pt.z,-RZ+.1,RZ-.1));
  if(grab.p)for(const k in grab.p.parts){const pt2=grab.p.parts[k];if(pt2.impale&&pt2.body.position.distanceTo(mouseBody.position)>.9){unimpale(pt2);addWound(grab.p,pt2,V(0,0,.05),3,true,true);knock(grab.p,60)}}}
function endGrab(){if(grab){world.removeConstraint(grab.c);grab=null}}

/* ---------- pointers ---------- */
const ptrs=new Map();let mode=null,down=null,pinch0=0,holdXY=null,holdT=0;
const cv=renderer.domElement;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{initAudio();$('drawer').hidden=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){endGrab();holdXY=null;mode='orbit2';const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);return}
  down={x:e.clientX,y:e.clientY,moved:0};const x=e.clientX,y=e.clientY,m=itemMode();
  if(e.button===2){mode='orbit';return}
  if(m==='grab'){const h=firstHit(x,y,true);if(h&&(h.p||h.prop)&&startGrab(h)){if(h.p)sel=h.p;mode='grab'}else mode='orbit'}
  else if(m==='swipe'){mode='swipe';lastSlice=[x,y];slice(x,y,item)}
  else if(m==='hold'){mode='hold';holdXY=[x,y];holdT=0}
  else mode='tap';
});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&itemMode()==='hold'){$('cross').style.left=e.clientX+'px';$('cross').style.top=e.clientY+'px'}
  const pr=ptrs.get(e.pointerId);if(!pr)return;const dx=e.clientX-pr.x,dy=e.clientY-pr.y;pr.x=e.clientX;pr.y=e.clientY;
  if(mode==='orbit2'&&ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);cam.r=clamp(cam.r*pinch0/d,1.2,7.5);pinch0=d;cam.th-=dx*.004;cam.ph=clamp(cam.ph-dy*.003,.35,1.65);return}
  if(down)down.moved+=Math.abs(dx)+Math.abs(dy);
  if(mode==='grab')moveGrab(e.clientX,e.clientY);
  else if(mode==='orbit'||(mode==='tap'&&down&&down.moved>10)){mode='orbit';cam.th-=dx*.006;cam.ph=clamp(cam.ph-dy*.005,.35,1.65)}
  else if(mode==='swipe'){const steps=Math.ceil(Math.hypot(dx,dy)/8);for(let i=1;i<=steps;i++)slice(e.clientX-dx+dx*i/steps,e.clientY-dy+dy*i/steps,item);lastSlice=[e.clientX,e.clientY]}
  else if(mode==='hold')holdXY=[e.clientX,e.clientY];
});
const upH=e=>{ptrs.delete(e.pointerId);
  if(mode==='tap'&&down&&down.moved<=10){const x=e.clientX,y=e.clientY;useTap(x,y)}
  if(mode==='orbit'&&itemMode()==='grab'&&down&&down.moved<=6){const h=personHit(e.clientX,e.clientY);if(!h)sel=null}
  if(ptrs.size===0){endGrab();mode=null;down=null;holdXY=null}else if(ptrs.size===1&&mode==='orbit2')mode='orbit'};
cv.addEventListener('pointerup',upH);cv.addEventListener('pointercancel',upH);
cv.addEventListener('wheel',e=>{e.preventDefault();cam.r=clamp(cam.r*(1+e.deltaY*.001),1.2,7.5)},{passive:false});
function surfacePoint(x,y){const h=firstHit(x,y,true);if(!h)return null;return h.point||h.room.point}
function useTap(x,y){
  switch(item){
  case 'pistol':case 'shotgun':case 'sniper':shoot(x,y,item);break;
  case 'axe':case 'hammer':case 'bat':melee(x,y,item);break;
  case 'heal':case 'adren':case 'poison':{const h=personHit(x,y);if(h){sel=h.p;syringe(h.p,item)}break}
  case 'del':{const h=firstHit(x,y,true);if(h&&h.p)removePerson(h.p);else if(h&&h.prop)removeProp(h.prop);break}
  default:{const pt=surfacePoint(x,y);if(!pt)break;
    if(item==='grenade')placeBomb(pt,true);else if(item==='bomb')placeBomb(pt,false);else if(item==='barrel')placeBarrel(pt);else if(item==='spikes')placeSpikes(pt);else if(item==='saw')placeSaw(pt);else if(item==='crusher')placeCrusher(pt);else if(item==='crate')placeCrate(pt)}
  }}
document.addEventListener('click',e=>{const it=e.target.closest('[data-item]');if(it){setItem(it.dataset.item);return}const a=e.target.closest('[data-act]');if(!a)return;
  switch(a.dataset.act){
  case 'drawer':if(item!=='grab'&&!$('drawer').hidden){$('drawer').hidden=true}else{renderDrawer();$('drawer').hidden=!$('drawer').hidden}break;
  case 'hands':setItem('grab');break;
  case 'spawn':{const cp=camera.position,dir=camera.getWorldDirection(new THREE.Vector3());sel=spawn(clamp(cp.x+dir.x*2.2,-RX+1,RX-1),clamp(cp.z+dir.z*2.2,-RZ+1,RZ-1));break}
  case 'xray':xray=!xray;$('xrayB').classList.toggle('on',xray);for(const p of people)setXray(p);break;
  case 'reset':for(const p of [...people])removePerson(p);for(const pr of [...props])removeProp(pr);drops=[];flames=[];dMesh.count=0;hMesh.count=0;dIdx=hIdx=0;setup();break;
  case 'close':sel=null;break;
  case 'more':showMore=!showMore;chipT=0;break;
  }});

/* ---------- audio ---------- */
let actx=null;const lastS={};
function initAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function snd(f,d,t,v,sl,n){if(!actx)return;const now=actx.currentTime;if(lastS[n]&&now-lastS[n]<.05)return;lastS[n]=now;try{const o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.setValueAtTime(f,now);if(sl)o.frequency.exponentialRampToValueAtTime(sl,now+d);g.gain.setValueAtTime(v,now);g.gain.exponentialRampToValueAtTime(.0001,now+d);o.connect(g);g.connect(actx.destination);o.start(now);o.stop(now+d)}catch(e){}}

/* ---------- vitals chip ---------- */
let showMore=false,chipT=0;
function chip(){const el=$('chip');if(!sel||!people.includes(sel)){el.hidden=true;return}el.hidden=false;const p=sel;
  const st=!p.alive?['Dead · '+p.cause,'rd']:!p.conscious?['Unconscious','y']:p.fire>0?['On fire!','rd']:p.wounds.some(w=>w.art&&!w.loose)?['Bleeding out','y']:p.state==='down'?['Hurt, on the ground','y']:p.fear>0?['Scared','y']:p.pain>30?['In pain','y']:['Okay','g'];
  const c=v=>v>60?'g':v>25?'y':'rd';let more='';
  if(showMore){const o=p.org,parts=Object.values(p.parts).filter(x=>!x.loose&&x.boneName);
    more=`<div class="more">${[['Brain',o.brain],['Heart',o.heart],['Left lung',o.lungL],['Right lung',o.lungR],['Upper spine',o.spineU],['Lower spine',o.spineD],['Guts',o.guts]].map(([n,v])=>`<div class="r"><span>${n}</span><em class="${c(v)}">${Math.round(v)}</em></div>`).join('')}
    ${parts.map(x=>`<div class="r"><span>${x.boneName}</span><em class="${x.bone>0?'g':'rd'}">${x.bone>0?'OK':'Broken'}</em></div>`).join('')}
    ${[['Carotid','carotid'],['Aorta','aorta'],['L arm artery','brachL'],['R arm artery','brachR'],['L leg artery','femL'],['R leg artery','femR']].map(([n,k])=>`<div class="r"><span>${n}</span><em class="${p.art[k]?'g':'rd'}">${p.art[k]?'OK':'Cut'}</em></div>`).join('')}
    <div class="r"><span>Limbs</span><em>${4-Object.keys(p.lost).length}/4</em></div><div class="r"><span>Pain</span><em class="${c(100-p.pain)}">${Math.round(p.pain)}</em></div></div>`}
  el.innerHTML=`<div class="h"><b>${p.name}</b><button data-act="close" aria-label="Close">×</button></div><div class="s ${st[1]}">${st[0]}</div>
  <div class="v"><span class="${p.heartOn?'g':'rd'}">♥ ${p.heartOn?p.bpm:'—'}</span><span class="${c(p.blood)}">Blood ${Math.round(p.blood)}%</span><span class="${c(p.oxy)}">O₂ ${Math.round(p.oxy)}%</span></div>${more}
  <button class="tg" data-act="more">${showMore?'Less':'Organs & bones'}</button>`}

/* ---------- loop ---------- */
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<innerHeight?80:64;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
function setup(){for(let i=0;i<4;i++){const a=i/4*Math.PI*2+.5;spawn(Math.cos(a)*1.6,Math.sin(a)*1.6)}placeCrate({x:-3.5,y:0,z:-3.5});placeCrate({x:-3.4,y:.7,z:-3.4});placeBarrel({x:3.6,y:0,z:-3.4});placeBarrel({x:4.2,y:0,z:-3});sel=null}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;tNow=now/1000;
  try{
    if(mode==='hold'&&holdXY){holdT-=dt;if(item==='minigun'&&holdT<=0){holdT=.065;shoot(holdXY[0],holdXY[1],'minigun')}if(item==='flamer')flamethrow(holdXY[0],holdXY[1])}
    world.step(1/60,dt,4);
    for(const p of people){bodySim(p,dt);if(p.twitch>0)p.twitch-=dt;for(const k in p.parts){const pt=p.parts[k];if(pt.slashT>0)pt.slashT-=dt;pt.mesh.position.copy(pt.body.position);pt.mesh.quaternion.copy(pt.body.quaternion)}}
    impaleCheck();sawCheck(dt);igniteCheck();stepParticles(dt);
    for(const pr of [...props]){if(pr.body&&pr.mesh&&pr.kind!=='spikes'&&pr.kind!=='saw'){pr.mesh.position.copy(pr.body.position);pr.mesh.quaternion.copy(pr.body.quaternion)}
      if(pr.kind==='bomb'){pr.t-=dt;pr.fuse.material.color.set(Math.sin(now/1000*(30-pr.t*10))>0?'#ff3b3b':'#ffb03b');if(pr.t<=0){pr.dead=1;const pos=new THREE.Vector3().copy(pr.body.position);removeProp(pr);explode(pos,2.2)}}
      if(pr.kind==='crusher'&&Math.abs(pr.body.velocity.y)<.05&&pr.body.position.y<.3)pr.body.isCrusher=false}
    if(boomT>0){boomT-=dt;const k=1-boomT/.45;boomM.scale.setScalar(.2+k*1.8);boomM.material.opacity=Math.max(0,.9*(1-k))}else boomM.material.opacity=0;
    flashL.intensity=Math.max(0,flashL.intensity-dt*25);light.intensity=flashT>0?1.7:1.25;if(flashT>0)flashT-=dt;
    // camera follows selected person gently
    let tx=0,ty=1,tz=0;if(sel&&people.includes(sel)){const b=sel.parts.lower.body.position;tx=b.x;ty=Math.max(.6,b.y);tz=b.z}
    cam.tx+=(tx-cam.tx)*Math.min(1,dt*2);cam.ty+=(ty-cam.ty)*Math.min(1,dt*2);cam.tz+=(tz-cam.tz)*Math.min(1,dt*2);
    const r=cam.r,sh=shake>0?rand(-shake,shake):0;shake=Math.max(0,shake-dt*.3);
    let px=cam.tx+r*Math.sin(cam.ph)*Math.sin(cam.th),py=cam.ty+r*Math.cos(cam.ph),pz=cam.tz+r*Math.sin(cam.ph)*Math.cos(cam.th);
    camera.position.set(clamp(px,-RX+.2,RX-.2)+sh,clamp(py,.25,RH-.2)+sh,clamp(pz,-RZ+.2,RZ-.2));camera.lookAt(cam.tx,cam.ty,cam.tz);
    renderer.render(scene,camera);
    chipT-=dt;if(chipT<=0){chipT=.25;chip()}
    if(tipT>0){tipT-=dt;if(tipT<=0)$('tip').style.opacity=0}
    $('cross').hidden=!(itemMode()==='hold'||['pistol','shotgun','sniper'].includes(item))||matchMedia('(pointer:coarse)').matches;
  }catch(err){console.error(err)}
  requestAnimationFrame(frame)}
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){$('cross').style.left=e.clientX+'px';$('cross').style.top=e.clientY+'px'}});
window.__rr={get people(){return people},get props(){return props},shoot,sever,explode,syringe,world,camera,melee,useTap,setItem,flamethrow,placeSpikes,placeSaw,placeCrusher};
resize();renderPill();setup();setItem('grab');requestAnimationFrame(frame);
}
</script>
